hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

async_training:
  staleness_threshold: 0.3
  trigger_parameter_sync_step: 2
  require_batches: 1
  partial_rollout: True
  use_rollout_log_probs: True
  compute_prox_log_prob: False
  use_trainer_do_validate: False

rollout:
  nnodes: 1
  n_gpus_per_node: 4
  n: 8
  total_rollout_steps: 8192
  total_epochs: 1
  test_freq: 20

data:
  max_prompt_length: 256
  max_response_length: 16384
  train_batch_size: 0
  gen_batch_size: 1
  val_batch_size: 32
  return_raw_chat: True
  shuffle: False
  filter_overlong_prompts: True
  truncation: error
  image_key: images

actor_rollout_ref:
  hybrid_engine: False
  model:
    trust_remote_code: True
    use_remove_padding: True
  rollout:
    name: vllm
    mode: async
    max_model_len: 32768
    calculate_log_probs: True
    agent:
      default_agent_loop: tool_agent
    multi_turn:
      enable: True
      max_user_turns: 5
      max_assistant_turns: 5
      max_parallel_calls: 1
      max_tool_response_length: 1024
      tool_response_truncate_side: left
      format: qwen
      tool_config_path: LNS/LNS_tool_config.yaml
    trace:
      backend: weave
      token2text: true
      max_samples_per_step_per_worker: 1

trainer:
  val_before_train: False
