tools:
  - name: search
    class_name: verl.tools.LNS.search_tool.SearchTool 
    config:
      type: native
      retrieval_service_url: http://163.239.28.21:5002/search
      timeout: 30
      num_workers: 120
      rate_limit: 120
      local_image_root: ./LNS/corpus/img
    tool_schema:
      type: function
      function:
        name: search
        description: Search the Image from the Image Corpus.
        parameters:
          type: object
          properties:
            query:  # QwenToolParser가 'query' 키로 넘겨주므로 맞춤
              type: string
              description: The search query string.
          required: [query]

  - name: bbox
    class_name: verl.tools.LNS.bbox_tool.ImageCropper
    config:
      type: native
      crops_dir: ./agent_crops
    tool_schema:
      type: function
      function:
        name: bbox
        description: Crop the image to focus on a specific region.
        parameters:
          type: object
          properties:
            bbox:   # QwenToolParser가 'bbox' 키로 넘겨주므로 맞춤
              type: array
              items: {type: number}
              description: "[left, top, right, bottom] coordinates."
          required: [bbox]
